#
# The configuration of the reference that stands for the proxying of
# requests, pointed at the very same upstream every server under test
# is pointed at, the placeholders are replaced by the harness.

worker_processes @WORKERS@;
error_log /dev/null crit;
pid @ROOT@/nginx.pid;
daemon off;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    sendfile off;
    tcp_nodelay on;
    gzip off;

    keepalive_timeout 65s;
    keepalive_requests 1000000;

    # the connections towards the upstream are pooled, which is what
    # the subject does with the backends it holds, a reference that
    # opened one per request would be measuring the opening of it
    upstream backend {
        server 127.0.0.1:@UPSTREAM@;
        keepalive 128;
    }

    server {
        listen @PORT@ default_server backlog=4096 reuseport;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
