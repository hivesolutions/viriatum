#
# The configuration of the reference that only ever stands on the
# proxying workload, it serves no file of its own and so it is never
# compared on one, the placeholders are replaced by the harness.

global
    nbthread @WORKERS@
    maxconn 8192
    log /dev/null local0 emerg

defaults
    mode http
    option http-keep-alive
    option dontlognull
    no option logasap
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout http-keep-alive 65s

frontend inbound
    bind :@PORT@
    default_backend outbound

backend outbound
    # the connections towards the upstream are held rather than opened
    # per request, matching the backends the subject keeps
    server upstream 127.0.0.1:@UPSTREAM@ maxconn 512
