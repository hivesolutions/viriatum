#
# The configuration of the reference that stands for the serving of
# files, the values that decide the comparison are matched against the
# ones the subject is run with and written down in the README beside
# this file, the placeholders are replaced by the harness.

worker_processes @WORKERS@;
error_log /dev/null crit;
pid @ROOT@/nginx.pid;
daemon off;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include @ROOT@/conf/mime.types;
    default_type application/octet-stream;

    # the logging of every request is the single most expensive thing
    # that a reference does and the subject does not, leaving it on
    # would measure the writing of a file on one side only
    access_log off;

    # the sending of a file through the kernel is a path the subject
    # does not have, keeping it on would compare the two of them on
    # the largest of the fixtures and nothing else
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    gzip off;

    # the connection is held for as long as the subject holds one and
    # is never closed on a count of requests, the default of nginx
    # closes it after a thousand and that alone shows up as a gap
    keepalive_timeout 65s;
    keepalive_requests 1000000;

    server {
        listen @PORT@ default_server backlog=4096 reuseport;
        server_name _;
        root @ROOT@/www;

        location / {
            autoindex on;
        }
    }
}
