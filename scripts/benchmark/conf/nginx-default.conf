# Copyright (c) 2008-2026 Hive Solutions Lda.
#
# The counterpart of the cheapest response the subject is able to
# produce, a fixed body that never reaches the file system, which is
# what makes it the ceiling of every other workload rather than a
# measurement of the storage underneath.

worker_processes @WORKERS@;
error_log /dev/null crit;
pid @ROOT@/nginx.pid;
daemon off;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    sendfile off;
    tcp_nodelay on;
    gzip off;

    keepalive_timeout 65s;
    keepalive_requests 1000000;

    server {
        listen @PORT@ default_server backlog=4096 reuseport;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "viriatum";
        }
    }
}
