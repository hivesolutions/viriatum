# Hive Viriatum Web Server
# Copyright (c) 2008-2026 Hive Solutions Lda.
#
# The reference of the proxying workload that is a framework rather
# than a packaged server, so it has to be built into a binary of its
# own before it may be measured beside the others.

[package]
name = "viriatum-benchmark-pingora"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
pingora = { version = "0.8", features = ["lb"] }
# the runtime is held below 1.54, which refuses the buffer of no size
# pingora gives every connection it accepts and so takes the service
# down on the very first one, until pingora stops asking for it
# (https://github.com/cloudflare/pingora/issues/1059)
tokio = "~1.53"

[[bin]]
name = "load_balancer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
